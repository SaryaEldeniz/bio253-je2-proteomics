ased selection</text><path d="M 1191 324 L 1191 340" fill="none" stroke="#078D92" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#analysis-arrow)"/><rect x="311" y="95" width="310" height="225" rx="18" fill="#EDF7F8" stroke="none" stroke-width="2"/><g transform="translate(330 143) scale(0.73)"><path d="M 45 0 L 45 92" fill="none" stroke="#B2C6CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M 5 18 L 66 18" fill="none" stroke="#247BA0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="31" cy="18" r="6" fill="#247BA0" stroke="#247BA0" stroke-width="2"/><path d="M 28 45 L 86 45" fill="none" stroke="#078D92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="61" cy="45" r="6" fill="#078D92" stroke="#078D92" stroke-width="2"/><path d="M 11 73 L 74 73" fill="none" stroke="#247BA0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="39" cy="73" r="6" fill="#247BA0" stroke="#247BA0" stroke-width="2"/></g><text x="427" y="132" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#17394D">Total proteins</text><text x="427" y="168" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#52717C">TSB vs SN interactions</text><text x="427" y="202" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#17394D">stk vs anc</text><text x="427" y="233" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#17394D">stp vs anc</text><text x="427" y="264" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#17394D">stp vs stk</text><rect x="666" y="95" width="300" height="225" rx="18" fill="#EDF7F8" stroke="none" stroke-width="2"/><g transform="translate(686 153) scale(0.76)"><path d="M 0 83 L 113 83 M 0 0 L 