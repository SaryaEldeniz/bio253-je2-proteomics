<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="analysis-title analysis-desc"><title id="analysis-title">JE2 protein and phosphosite analysis workflow</title><desc id="analysis-desc">Separate protein interaction and within-medium phosphosite comparisons feed functional enrichment, association networks, Venn sets and sequence logos. Protein-site matching prioritises candidates; direct substrates or occupancy are not established.</desc><defs><marker id="analysis-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#078D92"/></marker></defs><text x="30" y="42" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#17394D">Project analysis</text><text x="1370" y="40" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="end" fill="#52717C">TSB vs long-exposure SN is the main focus</text><rect x="30" y="95" width="235" height="480" rx="20" fill="#EAF0F7" stroke="none" stroke-width="2"/><g transform="translate(105 133) scale(0.9)"><ellipse cx="43" cy="12" rx="40" ry="12" fill="#DDEEF5" stroke="#247BA0" stroke-width="2"/><path d="M 3 12 L 3 76 C 3 92 83 92 83 76 L 83 12" fill="#EDF7F8" stroke="#247BA0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="43" cy="12" rx="40" ry="12" fill="#DDEEF5" stroke="#247BA0" stroke-width="2"/><path d="M 3 43 C 3 59 83 59 83 43" fill="none" stroke="#247BA0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="147" y="256" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#17394D">October exports</text><text x="147" y="291" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#17394D">JE2 protein IDs</text><text x="147" y="323" font-family="Ari