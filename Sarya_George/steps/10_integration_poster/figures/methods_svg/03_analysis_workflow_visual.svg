<svg xmlns="http://www.w3.org/2000/svg" width="970" height="354" viewBox="0 0 970 354" role="img" aria-labelledby="analysis-visual-title analysis-visual-desc"><title id="analysis-visual-title">Visual project analysis methods</title><desc id="analysis-visual-desc">Icon-led version of the existing workflow. Protein interactions compare stk versus anc, stp versus anc and stp versus stk. They feed enrichment; network nodes are independently selected from contrasts. Phosphosite mutant-versus-ancestor comparisons within media feed overlap, residue and JE2 sequence summaries, alongside separate interaction tests in the analysis. Protein/site signals are compared for prioritisation, without claiming completed occupancy correction or direct substrates. All icons, plots and networks are schematic method symbols. The A/T/S/P letters reproduce the requested methods icon: their heights are illustrative, not measured frequencies or a data-derived sequence motif. Detailed settings remain in the original methods panel and documentation.</desc><defs><marker id="analysis-visual-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#078D92"/></marker></defs><text x="20" y="28" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#17394D">Project analysis</text><text x="950" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="end" fill="#52717C">TSB vs SN</text><rect x="205" y="67" width="555" height="135" rx="22" fill="#EDF7F8" stroke="none" stroke-width="2"/><rect x="205" y="211" width="555" height="121" rx="22" fill="#EAF0F7" stroke="none" stroke-width="2"/><rect x="20" y="94" width="132" height="210" rx="22" fill="#EAF0F7" stroke="none" stroke-width="2"/><text x="86" y="119" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#17394D">ID mapping</text>